<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat with Ollama</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Chat with Ollama</h2>

  <div id="chat-box"></div>

  <form id="chat-form">

    <button type="submit">Send</button>
    <button type="button" id="clear-btn">Clear Chat</button>
  </form>

  <script src="script.js"></script>
</body>
</html>
