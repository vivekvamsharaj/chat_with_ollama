<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Ollama Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h2>Settings</h2>
            <div class="input-group">
                <label for="model-name">Ollama Model</label>
                <input type="text" id="model-name" value="llama3">
            </div>
            <button id="clear-btn" class="btn-clear">🗑️ Clear Chat History</button>
        </aside>

        <main class="chat-container">
            <header class="chat-header">
                <h1>🤖 Local Ollama Chat</h1>
                <p>Your private, local AI assistant</p>
            </header>
            
            <div id="chat-history" class="chat-history"></div>

            <footer class="chat-input-area">
                <div id="loading-indicator" class="hidden">
                    <span class="spinner"></span> Thinking...
                </div>
                <form id="chat-form">
                    <input type="text" id="user-input" placeholder="Type your message here..." autocomplete="off" required>
                    <button type="submit" id="send-btn">Send</button>
                </form>
            </footer>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
